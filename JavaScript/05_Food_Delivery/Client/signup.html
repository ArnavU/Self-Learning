<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signin</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
</head>

<body>
    <div class="w-3/4 mx-auto p-1">
        <h1 class="m-2 text-3xl font-bold"> Create new account...</h1>
        <div class="m-2">
            <label class="floating-label">
                <span>Your Name</span>
                <input type="text" id="inputName" placeholder="name" class="input input-md" />
            </label>
        </div>
        <div class="m-2">
            <label class="floating-label">
                <span>Your Email</span>
                <input type="text" id="inputEmail" placeholder="mail@site.com" class="input input-md" />
            </label>
        </div>
        <div class="m-2">
            <label class="floating-label">
                <span>Your password</span>
                <input type="password" id="inputPassword" placeholder="*****" class="input input-md" />
            </label>
        </div>
        <div class="m-2">
            <label class="floating-label">
                <span>Your Mobile</span>
                <input type="tel" id="inputMobile" placeholder="+91" class="input input-md" />
            </label>
        </div>
        <div class="m-2">
            <label>Already have an account ? To Signin </label><a href="signin.html" class="text-blue-500">Click
                Here</a>
        </div>
        <div class="m-2">
            <button class="btn btn-success" onclick="signup()">Signup</button>
        </div>
    </div>
    <script>
        async function signup() {
            const name = document.getElementById('inputName').value
            const email = document.getElementById('inputEmail').value
            const password = document.getElementById('inputPassword').value
            const mobile = document.getElementById('inputMobile').value
            const body = { name, email, password, mobile }
            try {
                const resposne = await axios.post('http://localhost:4000/user/signup', body)
                const result = resposne.data
                console.log(result)
            } catch (error) {
                console.log(error)
            }
        }
    </script>
</body>

</html>
