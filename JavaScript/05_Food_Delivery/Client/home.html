<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
</head>

<body onload="getFoodMenu()">
    <h1>Food Page</h1>
    <div id="root" class="grid grid-cols-3">
    </div>
    <script>
        async function getFoodMenu() {
            const div = document.getElementById('root')
            try {
                const response = await axios.get('http://localhost:4000/food/menu')
                const result = response.data
                if (result.status == 'success') {
                    const foodItems = result.data
                    console.log(foodItems)
                    for (food of foodItems) {
                        const card = `
                          <div class="card bg-base-100 w-80 shadow-sm m-2">
                            <figure>
                                <img src=${'http://localhost:4000/foodimage/' + food.image} alt="Shoes" />
                            </figure>
                            <div class="card-body">
                                <h2 class="card-title">${food.name}</h2>
                                <p>${food.description}</p>
                                <p>PRICE : ${food.price}</p>
                                <div class="card-actions justify-end">
                                    <button class="btn btn-primary">Add to cart</button>
                                </div>
                            </div>
                        </div>`
                        div.innerHTML += card
                    }
                }
                else
                    console.log(result.error)
            } catch (error) {
                console.log(error)
            }
        }
    </script>
</body>

</html>
